<style>
/* 레이아웃: 상단 바 + (데스크톱) 좌측 메뉴 / (모바일) 하단 탭. 야구장 잔디 톤의 다크 테마 단일 */
:root{
 --bg:#0c1511;--panel:#132019;--panel2:#1a2a22;--line:#25392e;--tx:#e8efe9;--mut:#8fa69a;
 --acc:#3ddc84;--acc2:#2bb673;--dirt:#d9a066;--warn:#f5b942;--bad:#ef5350;--blue:#5aa9ff;--gold:#ffd166;
 --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b1a14;z-index:60}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 13px;background:var(--panel2);color:var(--tx);font-weight:600;font-size:13px;min-height:36px}
button:hover{filter:brightness(1.18)}button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc2);color:#04140b}button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:4px 9px;font-size:12px;min-height:30px}button.warn{background:#4a3410;color:var(--gold)}button.dang{background:#4a1515;color:#ffb3b0}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
select,input{font-family:inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%}
.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,#0b1a14,#163a28);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{font-weight:900;color:var(--acc);letter-spacing:.5px;font-size:15px}
.club{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;min-width:0}
.sp{flex:1}
.chip{background:rgba(255,255,255,.06);padding:5px 11px;border-radius:20px;font-size:12px;color:var(--mut);white-space:nowrap}.chip b{color:var(--tx)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:3px}
.nav button{text-align:left;background:transparent;color:var(--mut);font-size:14px;padding:10px 14px}
.nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.main{overflow:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
h2{margin:0 0 12px;font-size:19px;text-wrap:balance}h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:700}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}.good{color:var(--acc)}.bad{color:var(--bad)}.warnc{color:var(--warn)}.gold{color:var(--gold)}
.n{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:10px;font-weight:900;border:2px solid;flex:none;background:var(--bg)}
.badge.lg{width:46px;height:46px;font-size:13px}
.kpi{background:var(--panel2);border-radius:12px;padding:10px 12px}.kpi .l{font-size:11.5px;color:var(--mut)}.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left}
tr.me td{background:rgba(61,220,132,.08)}tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(255,255,255,.04)}
.ovr{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:2px 5px;font-weight:800;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--panel2);color:var(--mut);margin-left:4px}
.tag.f{background:#21304a;color:var(--blue)}.tag.a{background:#3a2a10;color:var(--gold)}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.seg{display:inline-flex;background:var(--panel2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--mut);min-height:30px;padding:4px 11px}.seg button.on{background:var(--panel);color:var(--tx)}
.news{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow:auto}
.news div{font-size:13px;padding:7px 9px;background:var(--panel2);border-radius:8px}.news small{color:var(--mut);margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:16px}
/* 문자중계 */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .big{font-size:38px;font-weight:900}
.ls td,.ls th{text-align:center;padding:4px 5px}
.dia{width:120px;height:110px;flex:none}
.log{max-height:360px;overflow:auto;display:flex;flex-direction:column-reverse;gap:4px;font-size:13px}
.log div{padding:5px 8px;border-radius:6px;background:var(--panel2)}.log .hi{background:#123a26;color:#bff5d5}.log .inn{background:transparent;color:var(--dirt);font-weight:800;padding-top:8px}
.outs i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--panel2);margin-right:3px;border:1px solid var(--line)}.outs i.on{background:var(--bad)}
.start{max-width:880px;margin:0 auto;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clubs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.clubs button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--panel);border:1px solid var(--line);min-height:110px}
.clubs button.on{border-color:var(--acc);background:var(--panel2)}
.hero{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:0}.hero span{color:var(--acc)}
.pick td button{min-height:28px}
@media (max-width:860px){
 .app{display:block;height:auto}
 .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;overflow-x:auto;z-index:30;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:2px}
 .nav button{flex:1 0 auto;text-align:center;font-size:12.5px;padding:8px 10px}
 .nav button.on{box-shadow:inset 0 -2px 0 var(--acc)}
 .nav .ft{display:none}
 .main{padding-bottom:90px}
 .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
 .clubs{grid-template-columns:repeat(2,1fr)}
 .top .logo{display:none}.chip{font-size:11px;padding:4px 9px}
 .score .big{font-size:30px}.hero{font-size:24px}
 td,th{padding:6px 5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  const dout=this.outs-o0;if(dout){ps.out+=Math.min(dout,3-o0);F.out[pt.id]=(F.out[pt.id]||0)+Math.min(dout,3-o0)}
  const after=this.H.R-this.A.R;if(Math.sign(after)!==Math.sign(before)){if(after===0){this.wc={};this.lc={}}else{const W=after>0?this.H:this.A,Lo=after>0?this.A:this.H;this.wc[W.c]=W.pit;this.lc[Lo.c]=Lo.pit}}

function expansion(c){activeT(S.year).filter(x=>x!==c&&S.teams[x]&&roster(x).length).forEach(x=>{const r=roster(x).filter(p=>!p.fr&&!p.away).sort((a,b)=>b.ovr-a.ovr);[r[14+RI(0,3)],r[19+RI(0,3)]].forEach(p=>{if(p){p.t=c;RC={}}})});fill(c);news(`${tn(c,0,1)} 창단 · 특별 지명 완료`)}

/* ===== 트레이드 / 방출 ===== */
function trade(mid,tid){const a=S.P[mid],b=S.P[tid];if(!a||!b||a.t!==S.my||b.t===S.my)return;const va=val(a),vb=val(b);
 if(S.phase==='season'&&S.day>S.sched.length*.62){toast('트레이드 마감 이후입니다 (시즌 62% 지점)');return}
 if(va>=vb*1.04+1){const tb=b.t;a.t=tb;b.t=S.my;RC={};ensure(tb,true);ensure(S.my);news(`트레이드 성사: ${a.n} ↔ ${b.n} (${tn(tb)})`);toast('트레이드 성사!');S.tr={};save();render()}else toast(`${tn(b.t)}가 거절했습니다. 더 가치 있는 선수가 필요합니다 (${Math.round(va)} vs ${Math.round(vb*1.04+1)})`)}
function release(id){const p=S.P[id];if(!p||p.t!==S.my)return;if(roster(S.my).length<=28){toast('최소 28명은 유지해야 합니다');return}p.t=null;RC={};news(`${p.n} 방출`);delete S.P[id];ensure(S.my);closeM();save();render()}

/* ===== 저장 ===== */
const KEY='kbo-manager-98';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);RC={};return true}}catch(e){}return false}
function newGame(my){S={v:1,year:1998,my,day:0,phase:'season',teams:{},P:{},nid:1,news:[],recent:[],hist:[],legend:[],view:'home',tab:'H',st:'bat',tr:{}};
 for(const c of activeT(1998))S.teams[c]=mkTeam(c);
 REAL.filter(o=>o.e<=1998&&!(o.gap&&o.gap[0]<=1998&&o.gap[1]>=2099)).forEach(o=>{const p=newP({...o});if(o.gap&&1998>=o.gap[0]&&1998<=o.gap[1])p.away=1});
 for(const c of activeT(1998)){foreignFix(c,true);fill(c);roster(c).forEach(p=>p.sal=salary(p));ensure(c,true)}
 S.sched=mkSched();news(`1998 시즌 개막! ${tn(my,0,1)} 감독으로 부임했습니다`);save()}
</script>
<script>
/* ===== UI ===== */
const $=s=>document.querySelector(s);
const NAV=[['home','홈'],['live','경기'],['squad','선수단'],['lineup','라인업'],['stand','순위'],['stats','기록'],['trade','트레이드'],['hist','역사'],['set','설정']];
const fx=v=>isFinite(v)?v:0, e2=v=>isFinite(v)?v.toFixed(2):'-';
const oc=o=>o>=85?'background:#3a2f0c;color:var(--gold)':o>=75?'background:#123a26;color:var(--acc)':o>=65?'background:#14304d;color:var(--blue)':'background:var(--panel2);color:var(--mut)';
const ovrT=o=>`<span class="ovr" style="${oc(o)}">${o}</span>`;
const tags=p=>(p.fr?'<span class="tag f">외</span>':'')+(p.away?'<span class="tag a">해외</span>':'')+(p.fa?'<span class="tag a">FA</span>':'')+(S.phase!=='off'&&p.d===S.year&&!p.fr?'<span class="tag">신인</span>':'');
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1f3a2c;color:var(--tx);border:1px solid var(--acc2);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;font-size:13px';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2800)}
function go(v){S.view=v;render();const m=$('#main');if(m)m.scrollTop=0;window.scrollTo(0,0)}
function phaseLbl(){return S.phase==='season'?(S.sched[S.day]?dateOf(S.day):'정규시즌 종료'):S.phase==='post'?'포스트시즌':'비시즌'}
function render(){const app=$('#app');if(!S){app.innerHTML=startHTML();return}
 const T=S.teams[S.my],st=standings(),rk=st.indexOf(T)+1;
 app.innerHTML=`<div class="app"><header class="top"><span class="logo">KBO MANAGER</span><span class="club">${badge(S.my)}<span>${tn(S.my,0,1)}</span></span><span class="sp"></span><span class="chip"><b>${S.year}</b> ${phaseLbl()}</span><span class="chip n">${T.w}승 ${T.l}패 ${T.t}무 · <b>${rk}위</b></span></header>
 <nav class="nav">${NAV.map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}<div class="ft mut" style="margin-top:auto;font-size:11px;padding:8px">능력치는 게임용 추정치입니다</div></nav>
 <main class="main" id="main">${(V[S.view]||V.home)()}</main></div>`}

/* --- 시작 화면 --- */
let PICK='LG';
function startHTML(){const has=(()=>{try{return localStorage.getItem(KEY)}catch(e){return null}})();let sv=null;try{sv=has&&JSON.parse(has)}catch(e){}
 const stars=c=>REAL.filter(o=>o.t===c&&o.e<=1998&&!(o.gap&&o.gap[0]<=1998)).sort((a,b)=>b.pk-a.pk).slice(0,3).map(o=>o.n).join(' · ');
 return `<div class="start"><p class="mut" style="margin:0 0 6px;letter-spacing:2px;font-size:12px">KOREA BASEBALL ORGANIZATION</p><h1 class="hero">KBO 매니저 <span>1998</span></h1>
 <p class="mut" style="max-width:60ch;line-height:1.6">1998 시즌, 8개 구단 중 하나의 감독이 되어 시즌을 치르세요. 해가 지나면 실제 선수들이 데뷔 연도에 맞춰 리그에 합류하고, 2000년 SK·2001년 KIA·2008년 히어로즈·2013년 NC·2015년 KT로 리그가 바뀌어 갑니다.</p>
 ${sv?`<div class="card row" style="margin:14px 0;justify-content:space-between"><span>저장된 게임: <b>${sv.year}</b> ${tn(sv.my,sv.year,1)} (${sv.teams[sv.my].w}승 ${sv.teams[sv.my].l}패)</span><button class="pri" onclick="cont()">이어하기</button></div>`:''}
 <h3 style="margin-top:18px">구단 선택</h3><div class="clubs">${activeT(1998).map(c=>`<button class="${PICK===c?'on':''}" onclick="PICK='${c}';render()">${badge(c,1).replace(tn(c).slice(0,3),tn(c,1998).slice(0,3))}<b>${tn(c,1998,1)}</b><small class="mut" style="font-weight:400">${stars(c)}</small></button>`).join('')}</div>
 <div class="row" style="margin-top:16px"><button class="pri" onclick="begin()">${tn(PICK,1998,1)}로 1998 시즌 시작</button>${sv?'<span class="mut" style="font-size:12px">새로 시작하면 저장된 게임이 덮어써집니다</span>':''}</div>
 <p class="mut" style="font-size:12px;margin-top:22px">선수 능력치(OVR)는 게임용 추정치이며 공식 기록이 아닙니다. 선수 이적 이력은 단순화되어 있고, 명단에 없는 자리는 가상 선수로 채워집니다.</p></div>`}
function cont(){if(load()){S.view='home';render()}}
function begin(){newGame(PICK);render()}

/* --- 뷰 --- */
const V={};
V.home=()=>{if(S.phase==='off')return offHTML();const T=S.teams[S.my],st=standings(),rk=st.indexOf(T)+1,L=st[0];
 let top='';
 if(S.phase==='season'){const g=myGameToday();const left=S.sched.length-S.day;
  top=`<div class="card"><h3>${S.sched[S.day]?dateOf(S.day)+' 경기':'정규시즌 종료'}</h3>${g?`<div class="row" style="gap:14px;margin-bottom:12px">${badge(g[1],1)}<b style="font-size:16px">${tn(g[1])}</b><span class="mut">@</span>${badge(g[0],1)}<b style="font-size:16px">${tn(g[0])}</b></div>
  <div class="mut" style="font-size:12.5px;margin-bottom:12px">예고 선발 · ${prob(g[1])} vs ${prob(g[0])}</div>`:`<p class="mut">오늘은 ${tn(S.my)} 경기가 없는 날입니다.</p>`}
  <div class="row">${g?`<button class="pri" onclick="goLive()">문자중계로 보기</button><button onclick="act(1)">결과만 보기</button>`:`<button class="pri" onclick="act(1)">다음 날로</button>`}<button class="ghost" onclick="act(7)">7일 진행</button><button class="ghost" onclick="act(30)">30일 진행</button><button class="ghost" onclick="act(999)">시즌 끝까지</button></div><p class="mut" style="font-size:12px;margin:10px 0 0">남은 일정 ${left}일 · 팀당 ${gamesPer()}경기</p></div>`}
 else if(S.phase==='post')top=postHTML();
 const ra=T.rs-T.ra;
 return `<h2>${tn(S.my,0,1)} · ${S.year}</h2><div class="grid g4" style="margin-bottom:14px"><div class="kpi"><div class="l">순위</div><div class="v n">${rk}위 <small class="mut" style="font-size:12px">${rk>1?gb(T,L)+'G':''}</small></div></div><div class="kpi"><div class="l">승률</div><div class="v n">${f3(pct(T))}</div></div><div class="kpi"><div class="l">득실차</div><div class="v n ${ra>=0?'good':'bad'}">${ra>0?'+':''}${ra}</div></div><div class="kpi"><div class="l">연봉 / 예산</div><div class="v n" style="font-size:16px">${ok(payroll(S.my))} / ${ok(T.bud)}억</div></div></div>
 <div class="grid g2">${top}<div class="card"><h3>순위</h3>${miniStand()}</div><div class="card"><h3>최근 경기</h3>${S.recent.length?`<div class="tw"><table>${S.recent.slice(0,8).map(r=>`<tr><td class="l mut">${r.d}</td><td class="l">${r.h?'vs':'@'} ${tn(r.op)}</td><td class="${r.w==='승'?'good':r.w==='패'?'bad':''}"><b>${r.w}</b> ${r.m}:${r.o}</td><td class="l mut" style="font-size:12px">${r.wp?'승 '+r.wp:''}</td></tr>`).join('')}</table></div>`:'<p class="mut">아직 경기가 없습니다.</p>'}</div><div class="card"><h3>뉴스</h3><div class="news">${S.news.map(n=>`<div><small>${n[0]}</small>${n[1]}</div>`).join('')}</div></div></div>`};
function prob(c){const T=S.teams[c];ensure(c);const p=S.P[T.rot[T.ri%T.rot.length]];return p?`${p.n}(${p.s.w}승 ${p.s.l}패 ${e2(stat(p).era)})`:'-'}
function miniStand(){const st=standings(),L=st[0];return `<div class="tw"><table><tr><th class="l">#</th><th class="l">팀</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>차</th></tr>${st.map((T,i)=>`<tr class="${T.c===S.my?'me':''}"><td class="l">${i+1}</td><td class="l">${tn(T.c)}</td><td>${T.w}</td><td>${T.l}</td><td>${T.t}</td><td>${f3(pct(T))}</td><td>${i?gb(T,L):'-'}</td></tr>`).join('')}</table></div>`}
function act(n){if(S.phase==='season'){if(LIVE){simDay(LIVE);LIVE=null;n--}if(n>0)simDays(n)}save();render()}

/* 포스트시즌 */
function postHTML(){const P=S.post,c=P.cur;if(!c)return'';const me=c.hi===S.my||c.lo===S.my;
 return `<div class="card"><h3>${S.year} 포스트시즌 · ${c.nm}</h3><div class="row" style="gap:12px;margin-bottom:10px">${badge(c.hi,1)}<b>${tn(c.hi)}</b><span class="n" style="font-size:22px;font-weight:900">${c.wh} : ${c.wl}</span><b>${tn(c.lo)}</b>${badge(c.lo,1)}</div>
 <p class="mut" style="font-size:12.5px">${c.nh===c.nl?`${c.nh}승 선승제`:`${tn(c.hi)} 1승 어드밴티지 (1승 필요) · ${tn(c.lo)} 2승 필요`}</p>
 <div class="row">${me?`<button class="pri" onclick="goLive()">문자중계로 보기</button>`:''}<button class="${me?'':'pri'}" onclick="pAct(1)">다음 경기 진행</button><button class="ghost" onclick="pAct(99)">포스트시즌 끝까지</button></div>
 ${P.rounds.length?`<div style="margin-top:12px">${P.rounds.map(r=>`<div class="mut" style="font-size:12.5px">${r.nm}: <b style="color:var(--tx)">${tn(r.w)}</b> ${r.s} ${tn(r.l)}</div>`).join('')}</div>`:''}</div>`}
function pAct(n){for(let i=0;i<n&&S.phase==='post';i++){postGame(LIVE);LIVE=null}save();render()}

/* 문자중계 */
function goLive(){if(S.phase==='season'){const g=myGameToday();if(!g)return;if(!LIVE)LIVE=new Game(g[0],g[1],{log:1})}else if(S.phase==='post'&&S.post.cur){const c=S.post.cur;if(!LIVE)LIVE=new Game(c.hi,c.lo,{log:1,post:1})}go('live')}
function lv(k){if(!LIVE)return;const g=LIVE;if(k==='pa')g.step();else if(k==='inn'){const i=g.inn,t=g.top;let s=0;while(!g.over&&g.inn===i&&g.top===t&&s++<60)g.step()}else g.run();render()}
function auto(){if(AUTO){clearInterval(AUTO);AUTO=null;render();return}AUTO=setInterval(()=>{if(!LIVE||LIVE.over||S.view!=='live'){clearInterval(AUTO);AUTO=null;render();return}LIVE.step();render()},650);render()}
function endLive(){if(AUTO){clearInterval(AUTO);AUTO=null}if(S.phase==='season')simDay(LIVE);else postGame(LIVE);LIVE=null;save();go('home')}
function dia(b){const sq=(x,y,on)=>`<rect x="-8" y="-8" width="16" height="16" transform="translate(${x},${y}) rotate(45)" fill="${on?'#ffd166':'#1a2a22'}" stroke="#d9a066" stroke-width="1.5"/>`;
 return `<svg class="dia" viewBox="0 0 120 110" aria-label="주자 상황"><polygon points="60,100 108,54 60,8 12,54" fill="#1e3a29" stroke="#2f5a40"/><circle cx="60" cy="58" r="16" fill="#5a4330" opacity=".55"/>${sq(108,54,b[0])}${sq(60,8,b[1])}${sq(12,54,b[2])}<polygon points="60,94 66,100 60,106 54,100" fill="#e8efe9"/></svg>`}
V.live=()=>{const g=LIVE;if(!g){const has=(S.phase==='season'&&myGameToday())||(S.phase==='post'&&S.post.cur&&(S.post.cur.hi===S.my||S.post.cur.lo===S.my));return `<h2>문자중계</h2><div class="card"><p class="mut">${has?'오늘 경기를 문자중계로 볼 수 있습니다.':'지금 볼 수 있는 경기가 없습니다.'}</p>${has?'<button class="pri" onclick="goLive()">경기 시작</button>':'<button onclick="go(\'home\')">홈으로</button>'}</div>`}
 const n=Math.max(9,g.A.line.length,g.H.line.length),B=g.bat(),F=g.fld(),nb=B.lu[B.bi%9].p;
 const row=X=>`<tr><td class="l">${badge(X.c)}</td>${Array.from({length:n},(_,i)=>`<td>${X.line[i]??''}</td>`).join('')}<td><b>${X.R}</b></td><td class="mut">${X.H}</td></tr>`;
 return `<h2>${tn(g.A.c)} vs ${tn(g.H.c)}${g.post?' · '+(S.post.cur?S.post.cur.nm:''):''}</h2>
 <div class="grid g2"><div class="card"><div class="score"><div>${badge(g.A.c,1)}<div class="mut" style="margin-top:4px">${tn(g.A.c)}</div></div><div class="big n">${g.A.R} : ${g.H.R}</div><div>${badge(g.H.c,1)}<div class="mut" style="margin-top:4px">${tn(g.H.c)}</div></div></div>
 <div class="tw" style="margin-top:12px"><table class="ls"><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th><th>H</th></tr>${row(g.A)}${row(g.H)}</table></div>
 <div class="row" style="margin-top:12px;gap:14px;align-items:center">${dia(g.b)}<div style="min-width:0;flex:1"><div style="font-weight:800">${g.over?'경기 종료':`${g.inn}회${g.top?'초':'말'}`}</div><div class="outs" style="margin:6px 0">${[0,1].map(i=>`<i class="${g.outs>i?'on':''}"></i>`).join('')} <span class="mut" style="font-size:12px">${g.outs} 아웃</span></div>${g.over?'':`<div style="font-size:13px">타자 <b>${nb.n}</b> <span class="mut">${f3(stat(nb).avg)} ${nb.s.hr}HR</span></div><div style="font-size:13px">투수 <b>${F.pit.n}</b> <span class="mut">${F.pc}구</span></div>`}</div></div>
 <div class="row" style="margin-top:12px">${g.over?`<button class="pri" onclick="endLive()">결과 반영하고 계속</button>`:`<button class="pri" onclick="lv('pa')">다음 타석</button><button onclick="lv('inn')">이닝 끝까지</button><button onclick="auto()">${AUTO?'자동 멈춤':'자동 진행'}</button><button class="ghost" onclick="lv('end')">경기 끝까지</button>`}</div></div>
 <div class="card"><h3>중계</h3><div class="log">${g.log.map(([c,t])=>`<div class="${c==='inn'?'inn':c==='hi'?'hi':''}">${t}</div>`).join('')}</div></div></div>`};

/* 선수단 */
function hRow(p){const x=stat(p),s=p.s;return `<td>${s.g}</td><td>${f3(x.avg)}</td><td>${s.hr}</td><td>${s.rbi}</td><td>${f3(fx(x.obp)+fx(x.slg))}</td>`}
function pRow(p){const x=stat(p),s=p.s;return `<td>${s.pg}</td><td>${e2(x.era)}</td><td>${s.w}-${s.l}</td><td>${s.sv}</td><td>${s.out?Math.floor(s.out/3)+'.'+s.out%3:'0'}</td>`}
V.squad=()=>{const c=S.vt&&S.teams[S.vt]?S.vt:S.my,bat=S.st!=='pit';const ps=roster(c).filter(p=>isP(p)!==bat).sort((a,b)=>b.ovr-a.ovr);
 return `<h2>선수단</h2><div class="row" style="margin-bottom:12px"><select id="vt" onchange="S.vt=this.value;render()">${activeT(S.year).map(x=>`<option value="${x}" ${x===c?'selected':''}>${tn(x,0,1)}</option>`).join('')}</select><div class="seg"><button class="${bat?'on':''}" onclick="S.st='bat';render()">타자</button><button class="${bat?'':'on'}" onclick="S.st='pit';render()">투수</button></div><span class="mut n" style="font-size:12.5px">${roster(c).length}명 · 연봉 ${ok(payroll(c))}억</span></div>
 <div class="card"><div class="tw"><table><tr><th class="l">이름</th><th class="l">포지션</th><th>나이</th><th>OVR</th>${bat?'<th>경기</th><th>타율</th><th>홈런</th><th>타점</th><th>OPS</th>':'<th>경기</th><th>ERA</th><th>승-패</th><th>세</th><th>이닝</th>'}<th>연봉</th></tr>
 ${ps.map(p=>`<tr class="cl" onclick="openP(${p.id})"><td class="l"><b>${p.n}</b>${tags(p)}</td><td class="l mut">${p.pos}</td><td>${age(p)}</td><td>${ovrT(p.ovr)}</td>${bat?hRow(p):pRow(p)}<td class="mut">${ok(p.sal)}</td></tr>`).join('')}</table></div></div>`};
function bars(p){const L=isP(p)?[['구위','stf'],['제구','ctl'],['체력','sta']]:[['컨택','con'],['파워','pow'],['선구','eye'],['스피드','spd'],['수비','def']];
 return L.map(([l,k])=>{const v=p.r[k];return `<div class="row" style="flex-wrap:nowrap;gap:10px"><span style="width:44px;font-size:12px" class="mut">${l}</span><div class="bar" style="flex:1"><i style="width:${v}%;background:${v>=80?'var(--gold)':v>=65?'var(--acc)':'var(--blue)'}"></i></div><b class="n" style="width:26px;text-align:right">${v}</b></div>`}).join('')}
function openP(id){const p=S.P[id];if(!p)return;const hit=!isP(p),car=p.car.slice(-14).reverse();
 const cr=c=>hit?`<td>${c.g}</td><td>${f3(c.h/c.ab)}</td><td>${c.hr}</td><td>${c.rbi}</td><td>${c.h}</td>`:`<td>${c.pg}</td><td>${e2(c.er*27/c.out)}</td><td>${c.w}-${c.l}</td><td>${c.sv}</td><td>${Math.floor(c.out/3)}</td>`;
 const m=document.createElement('div');m.className='modal';m.id='modal';m.onclick=e=>{if(e.target===m)closeM()};
 m.innerHTML=`<div class="box"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="row">${p.t?badge(p.t,1):''}<div><div style="font-size:18px;font-weight:900">${p.n}${tags(p)}</div><div class="mut" style="font-size:12.5px">${p.t?tn(p.t,0,1):'자유계약'} · ${p.pos} · ${age(p)}세 · ${p.b}년생 · 연봉 ${ok(p.sal)}억 · ${p.svc}년차</div></div></div>${ovrT(p.ovr)}</div>
 <div style="display:grid;gap:7px;margin:14px 0">${bars(p)}</div>
 <h3>시즌 기록 (${S.year})</h3><div class="tw"><table><tr>${hit?'<th>경기</th><th>타율</th><th>홈런</th><th>타점</th><th>OPS</th>':'<th>경기</th><th>ERA</th><th>승-패</th><th>세</th><th>이닝</th>'}</tr><tr>${(hit?hRow(p):pRow(p))}</tr></table></div>
 ${car.length?`<h3 style="margin-top:14px">통산 (최근 ${car.length}시즌)</h3><div class="tw"><table><tr><th class="l">연도</th><th class="l">팀</th>${hit?'<th>경기</th><th>타율</th><th>홈런</th><th>타점</th><th>안타</th>':'<th>경기</th><th>ERA</th><th>승-패</th><th>세</th><th>이닝</th>'}</tr>${car.map(c=>`<tr><td class="l">${c.y}</td><td class="l mut">${c.t?tn(c.t,c.y):''}</td>${cr(c)}</tr>`).join('')}</table></div>`:''}
 <div class="row" style="margin-top:14px;justify-content:flex-end">${p.t===S.my?`<button class="dang" id="relb" onclick="if(this.dataset.c){release(${p.id})}else{this.dataset.c=1;this.textContent='한 번 더 누르면 방출'}">방출</button>`:p.t?`<button class="warn" onclick="S.tr.t=${p.id};S.tr.tt='${p.t}';closeM();go('trade')">트레이드 대상으로</button>`:''}<button onclick="closeM()">닫기</button></div></div>`;
 closeM();document.body.appendChild(m)}
function closeM(){const m=$('#modal');if(m)m.remove()}

/* 라인업 */
V.lineup=()=>{const c=S.my,T=S.teams[c];ensure(c);const hs_=avail(c).filter(p=>!isP(p)).sort((a,b)=>b.ovr-a.ovr),ps=avail(c).filter(isP).sort((a,b)=>b.ovr-a.ovr);
 const opt=(arr,sel)=>arr.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${p.n} (${p.pos} ${p.ovr})</option>`).join('');
 const cnt={};T.lineup.forEach(x=>cnt[x.pos]=(cnt[x.pos]||0)+1);const miss=POS9.filter(x=>!cnt[x]);
 return `<h2>라인업 · 투수진</h2><div class="row" style="margin-bottom:12px"><button class="pri" onclick="autoLU(S.my);save();render()">자동 편성</button><span class="mut" style="font-size:12.5px">선수를 바꾸면 기존 자리의 선수와 서로 교체됩니다</span></div>
 ${miss.length?`<p class="warnc" style="font-size:13px">비어 있는 수비 위치: ${miss.join(', ')} · 수비력이 떨어질 수 있습니다</p>`:''}
 <div class="grid g2"><div class="card"><h3>타순</h3><div style="display:grid;gap:8px">${T.lineup.map((x,i)=>{const p=S.P[x.id];return `<div class="row" style="flex-wrap:nowrap"><b class="n" style="width:18px">${i+1}</b><select id="lp${i}" style="width:68px" onchange="setLU(${i},'pos',this.value)">${POS9.map(q=>`<option ${q===x.pos?'selected':''}>${q}</option>`).join('')}</select><select id="lu${i}" style="flex:1;min-width:0" onchange="setLU(${i},'id',this.value)">${opt(hs_,x.id)}</select><span class="mut n" style="font-size:12px;width:44px;text-align:right">${f3(stat(p).avg)}</span></div>`}).join('')}</div></div>
 <div class="card"><h3>선발 로테이션</h3><div style="display:grid;gap:8px">${T.rot.map((id,i)=>`<div class="row" style="flex-wrap:nowrap"><b class="n" style="width:18px">${i+1}</b><select id="rt${i}" style="flex:1;min-width:0" onchange="setRot(${i},this.value)">${opt(ps,id)}</select><span class="mut n" style="font-size:12px;width:44px;text-align:right">${e2(stat(S.P[id]).era)}</span></div>`).join('')}</div>
 <h3 style="margin-top:16px">마무리</h3><select id="clo" style="width:100%" onchange="S.teams[S.my].cl=+this.value;save()">${opt(ps.filter(p=>!T.rot.includes(p.id)),T.cl)}</select>
 <p class="mut" style="font-size:12px;margin-bottom:0">나머지 투수는 불펜에서 능력·피로도에 따라 자동 기용됩니다.</p></div></div>`};
function setLU(i,k,v){const L=S.teams[S.my].lineup;if(k==='id'){v=+v;const j=L.findIndex((x,jj)=>jj!==i&&x.id===v);if(j>=0)L[j].id=L[i].id}L[i][k]=v;save();render()}
function setRot(i,v){const T=S.teams[S.my];v=+v;const j=T.rot.indexOf(v),old=T.rot[i];T.rot[i]=v;if(j>=0&&j!==i)T.rot[j]=old;if(T.cl===v)T.cl=old;save();render()}

/* 순위 */
V.stand=()=>{const st=standings(),L=st[0];return `<h2>${S.year} 순위</h2><div class="card"><div class="tw"><table><tr><th class="l">순위</th><th class="l">팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>게임차</th><th>득점</th><th>실점</th><th class="l">최근 10</th></tr>
 ${st.map((T,i)=>`<tr class="cl ${T.c===S.my?'me':''}" onclick="S.vt='${T.c}';go('squad')"><td class="l">${i+1}</td><td class="l"><span class="row" style="flex-wrap:nowrap">${badge(T.c)}${tn(T.c,0,1)}</span></td><td>${T.w+T.l+T.t}</td><td>${T.w}</td><td>${T.l}</td><td>${T.t}</td><td>${f3(pct(T))}</td><td>${i?gb(T,L):'-'}</td><td>${T.rs}</td><td>${T.ra}</td><td class="l" style="letter-spacing:1px;font-size:12px">${T.last.map(x=>`<span class="${x==='W'?'good':x==='L'?'bad':'mut'}">${x==='W'?'승':x==='L'?'패':'무'}</span>`).join('')}</td></tr>`).join('')}</table></div>
 <p class="mut" style="font-size:12px;margin-bottom:0">승률 = 승 ÷ (승+패), 무승부 제외 · 상위 ${S.year>=2015&&st.length>=10?5:4}팀 포스트시즌 진출</p></div>${S.post?`<div style="margin-top:14px">${postHTML()}</div>`:''}`};

/* 기록 */
V.stats=()=>{const my=S.lf==='my',all=Object.values(S.P).filter(p=>p.t&&(!my||p.t===S.my));const gp=c=>{const T=S.teams[c];return Math.max(1,T.w+T.l+T.t)};
 const qb=all.filter(p=>!isP(p)&&p.s.pa>=gp(p.t)*3.1),qp=all.filter(p=>isP(p)&&p.s.out>=gp(p.t)*3),H=all.filter(p=>!isP(p)),P=all.filter(isP);
 const cat=(t,arr,f,fmt,asc)=>`<div class="card"><h3>${t}</h3>${arr.filter(p=>isFinite(f(p))).sort((a,b)=>asc?f(a)-f(b):f(b)-f(a)).slice(0,5).map((p,i)=>`<div class="row cl" style="flex-wrap:nowrap;padding:5px 0;cursor:pointer;border-bottom:1px solid var(--line)" onclick="openP(${p.id})"><b class="n mut" style="width:16px">${i+1}</b>${badge(p.t)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${p.n}</span><b class="n">${fmt(f(p))}</b></div>`).join('')||'<p class="mut">기록 없음</p>'}</div>`;
 const I=v=>v;return `<h2>${S.year} 기록 순위</h2><div class="seg" style="margin-bottom:12px"><button class="${my?'':'on'}" onclick="S.lf='all';render()">리그 전체</button><button class="${my?'on':''}" onclick="S.lf='my';render()">${tn(S.my)}</button></div>
 <div class="grid g3">${cat('타율',qb,p=>stat(p).avg,f3)}${cat('홈런',H,p=>p.s.hr,I)}${cat('타점',H,p=>p.s.rbi,I)}${cat('안타',H,p=>p.s.h,I)}${cat('OPS',qb,p=>stat(p).obp+stat(p).slg,f3)}${cat('득점',H,p=>p.s.r,I)}${cat('평균자책점',qp,p=>stat(p).era,e2,1)}${cat('다승',P,p=>p.s.w,I)}${cat('세이브',P,p=>p.s.sv,I)}${cat('탈삼진',P,p=>p.s.pk,I)}${cat('WHIP',qp,p=>stat(p).whip,e2,1)}${cat('이닝',P,p=>p.s.out/3,v=>v.toFixed(1))}</div>`};

/* 트레이드 */
V.trade=()=>{const tr=S.tr||(S.tr={}),mine=roster(S.my).slice().sort((a,b)=>b.ovr-a.ovr),tt=tr.tt&&S.teams[tr.tt]&&tr.tt!==S.my?tr.tt:activeT(S.year).find(c=>c!==S.my),theirs=roster(tt).filter(p=>!p.away).sort((a,b)=>b.ovr-a.ovr);
 const m=S.P[tr.m]&&S.P[tr.m].t===S.my?S.P[tr.m]:mine[0],t=S.P[tr.t]&&S.P[tr.t].t===tt?S.P[tr.t]:theirs[0];
 const o=(arr,sel)=>arr.map(p=>`<option value="${p.id}" ${p===sel?'selected':''}>${p.n} · ${p.pos} · ${age(p)}세 · ${p.ovr}</option>`).join('');
 const card=p=>p?`<div class="row" style="margin-top:10px;flex-wrap:nowrap">${ovrT(p.ovr)}<div style="min-width:0"><b>${p.n}</b>${tags(p)}<div class="mut" style="font-size:12px">${p.pos} · ${age(p)}세 · 연봉 ${ok(p.sal)}억 · 가치 ${Math.round(val(p))}</div></div></div>`:'';
 const closed=S.phase==='season'&&S.day>S.sched.length*.62;
 return `<h2>트레이드</h2><p class="mut" style="font-size:13px;margin-top:-6px">1:1 맞트레이드 · 상대 구단은 나이와 잠재력을 반영한 선수 가치로 판단합니다. 마감: 정규시즌 62% 지점</p>
 <div class="grid g2"><div class="card"><h3>보낼 선수 (${tn(S.my)})</h3><select id="trm" style="width:100%" onchange="S.tr.m=+this.value;render()">${o(mine,m)}</select>${card(m)}</div>
 <div class="card"><h3>받을 선수</h3><div class="row" style="flex-wrap:nowrap"><select id="trt" onchange="S.tr.tt=this.value;S.tr.t=null;render()">${activeT(S.year).filter(c=>c!==S.my).map(c=>`<option value="${c}" ${c===tt?'selected':''}>${tn(c)}</option>`).join('')}</select><select id="trp" style="flex:1;min-width:0" onchange="S.tr.t=+this.value;render()">${o(theirs,t)}</select></div>${card(t)}</div></div>
 <div class="row" style="margin-top:14px"><button class="pri" ${closed||!m||!t?'disabled':''} onclick="trade(${m?m.id:0},${t?t.id:0})">트레이드 제안</button>${closed?'<span class="warnc" style="font-size:13px">트레이드 마감 이후입니다</span>':''}</div>`};

/* 역사 */
V.hist=()=>`<h2>KBO 역사</h2><div class="card"><h3>시즌별 결과</h3>${S.hist.length?`<div class="tw"><table><tr><th class="l">연도</th><th class="l">우승</th><th class="l">준우승</th><th class="l">정규 1위</th><th class="l">MVP</th><th class="l">신인왕</th><th>${tn(S.my)}</th></tr>${S.hist.map(h=>`<tr><td class="l">${h.y}</td><td class="l gold"><b>${tn(h.ch,h.y)}</b></td><td class="l">${tn(h.ru,h.y)}</td><td class="l">${tn(h.first,h.y)}</td><td class="l">${h.mvp?`${h.mvp.n} <span class="mut">(${tn(h.mvp.t,h.y)})</span>`:''}</td><td class="l">${h.roy?`${h.roy.n} <span class="mut">(${tn(h.roy.t,h.y)})</span>`:''}</td><td>${h.my.rk}위 ${h.my.w}-${h.my.l}</td></tr>`).join('')}</table></div>`:'<p class="mut">첫 시즌을 마치면 기록이 쌓입니다.</p>'}</div>
 <div class="card" style="margin-top:14px"><h3>떠난 스타 (은퇴 · 해외 진출)</h3>${S.legend.length?`<div class="tw"><table><tr><th class="l">이름</th><th class="l">구단</th><th class="l">기간</th><th class="l">구분</th><th class="l">통산</th></tr>${S.legend.map(l=>`<tr><td class="l"><b>${l.n}</b></td><td class="l">${l.t?tn(l.t,l.y1):''}</td><td class="l mut">${l.y0}–${l.y1}</td><td class="l mut">${l.why}</td><td class="l">${l.pos==='SP'||l.pos==='RP'?`${l.c.w||0}승 ${l.c.sv||0}세 ERA ${e2((l.c.er||0)*27/(l.c.out||1))}`:`${l.c.h||0}안타 ${l.c.hr||0}홈런 타율 ${f3((l.c.h||0)/(l.c.ab||1))}`}</td></tr>`).join('')}</table></div>`:'<p class="mut">아직 없습니다.</p>'}</div>`;

/* 설정 */
V.set=()=>`<h2>설정</h2><div class="card"><div class="row"><button class="pri" onclick="save();toast('저장했습니다')">지금 저장</button><button class="dang" onclick="if(this.dataset.c){try{localStorage.removeItem(KEY)}catch(e){};S=null;LIVE=null;render()}else{this.dataset.c=1;this.textContent='한 번 더 누르면 새 게임'}">새 게임</button></div>
 <p class="mut" style="font-size:13px;line-height:1.6">진행 상황은 경기·행동마다 이 브라우저에 자동 저장됩니다. 다른 기기와는 공유되지 않습니다.<br>선수 능력치(OVR)·세부 능력치는 게임용 추정치이며 실제 공식 수치가 아닙니다. 실존 선수는 데뷔(또는 KBO 합류) 연도에 원소속 구단으로 합류하고, 해외 진출 기간에는 자리를 비웁니다. 이후 이적은 게임 안에서 새로 만들어집니다.</p></div>`;

/* 비시즌 */
function offHTML(){const o=S.off,h=S.hist[0];const steps=['시상식','드래프트','FA · 외국인'];
 const head=`<h2>${S.year} 비시즌</h2><div class="seg" style="margin-bottom:14px">${steps.map((s,i)=>`<button class="${o.step===i?'on':''}" disabled>${i+1}. ${s}</button>`).join('')}</div>`;
 if(o.step===0)return head+`<div class="grid g2"><div class="card"><h3>${S.year} 한국시리즈 우승</h3><div class="row" style="gap:12px">${badge(h.ch,1)}<b style="font-size:20px">${tn(h.ch,0,1)}</b></div><p class="mut">준우승 ${tn(h.ru)} · 정규시즌 1위 ${tn(h.first)}</p>
  <p><b class="gold">MVP</b> ${h.mvp?`${h.mvp.n} (${tn(h.mvp.t)}) · ${h.mvp.l}`:'-'}</p><p><b class="good">신인왕</b> ${h.roy?`${h.roy.n} (${tn(h.roy.t)}) · ${h.roy.l}`:'-'}</p><p class="mut">${tn(S.my)}: ${h.my.rk}위 (${h.my.w}승 ${h.my.l}패 ${h.my.t}무)</p></div>
  <div class="card"><h3>은퇴 · 퇴단</h3>${o.ret.length?`<div class="news">${o.ret.map(r=>`<div>${r}</div>`).join('')}</div>`:'<p class="mut">주요 은퇴 선수 없음</p>'}</div></div><div class="row" style="margin-top:14px"><button class="pri" onclick="startDraft();render()">신인 드래프트 시작</button></div>`;
 if(o.step===1){const D=o.dr,turn=D.ord[D.i]===S.my;return head+`<div class="grid g2"><div class="card"><h3>${D.rd+1}라운드 · ${turn?'<span class="good">지명 차례입니다</span>':''}</h3><div class="tw"><table class="pick"><tr><th class="l">이름</th><th class="l">포지션</th><th>나이</th><th>현재</th><th class="l">잠재력</th><th></th></tr>${D.pool.map((p,k)=>`<tr><td class="l"><b>${p.n}</b></td><td class="l mut">${p.pos}</td><td>${S.year+1-p.b}</td><td>${Math.round(cl(p.pk+curve(S.year+1-p.b),25,99))}</td><td class="l gold">${'★'.repeat(p.star)}<span class="mut">${'☆'.repeat(5-p.star)}</span></td><td><button class="sm pri" onclick="userDraft(${k})">지명</button></td></tr>`).join('')}</table></div></div><div class="card"><h3>지명 현황</h3><div class="news">${D.log.slice().reverse().map(l=>`<div>${l}</div>`).join('')||'<div class="mut">-</div>'}</div></div></div>`}
 const fa=o.fa.map(id=>S.P[id]).filter(p=>p&&p.fa).sort((a,b)=>b.ovr-a.ovr),myF=avail(S.my).filter(p=>p.fr);
 return head+`<p class="mut" style="font-size:13px;margin-top:-4px">연봉 ${ok(payroll(S.my))}억 / 예산 ${ok(S.teams[S.my].bud)}억 · 다음 시즌 예산은 약 ${ok(30*mult(S.year+1))}억 · 로스터 ${roster(S.my).length}명</p><div class="grid g2"><div class="card"><h3>FA 시장</h3>${fa.length?`<div class="tw"><table><tr><th class="l">이름</th><th class="l">원소속</th><th>나이</th><th>OVR</th><th>요구 연봉</th><th></th></tr>${fa.map(p=>`<tr><td class="l cl" onclick="openP(${p.id})"><b>${p.n}</b> <span class="mut">${p.pos}</span></td><td class="l">${tn(p.t)}</td><td>${age(p)+1}</td><td>${ovrT(p.ovr)}</td><td>${ok(p.ask)}억</td><td>${p.fa===2?'<span class="mut">거절</span>':`<button class="sm ${p.t===S.my?'':'pri'}" onclick="signFA(${p.id})">${p.t===S.my?'재계약':'영입 제안'}</button>`}</td></tr>`).join('')}</table></div>`:'<p class="mut">올해 FA 자격 선수가 없습니다.</p>'}</div>
 <div class="card"><h3>외국인 선수 (${myF.length}/${flimNext()})</h3>${myF.map(p=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px">${ovrT(p.ovr)}<span style="flex:1">${p.n} <span class="mut">${p.pos}</span></span><button class="sm dang" onclick="release(${p.id})">방출</button></div>`).join('')}
 <h3 style="margin-top:12px">영입 후보</h3>${o.fc.map((p,k)=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px">${ovrT(p.est)}<span style="flex:1">${p.n} <span class="mut">${p.pos} · ${S.year+1-p.b}세</span></span><button class="sm pri" onclick="signForeign(${k})">영입</button></div>`).join('')}<p class="mut" style="font-size:12px;margin-bottom:0">외국인 자리를 비워 두면 개막 전 구단이 자동으로 채웁니다.</p></div></div>
 <div class="row" style="margin-top:14px"><button class="pri" onclick="newYear();S.view='home';render()">${S.year+1} 시즌 시작</button></div>`}

window.claude?.hot?.ready?window.claude.hot.ready(()=>{if(load())S.view=S.view||'home';render()}):(()=>{if(load())S.view=S.view||'home';render()})();
</script>
</body></html>
